<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>計畫書內容｜補助審查大公開</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <a class="back-link" href="index.html">← 返回</a>
    <h1>計畫書內容</h1>
  </div>
  <p class="muted" style="margin-top:-8px;">點選計畫書名稱開啟內容（PDF）</p>

  <div id="list" style="margin-top:16px;">
    <p class="muted">載入中…</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script>
async function load() {
  const list = document.getElementById("list");
  try {
    const snap = await db.collection("plans").orderBy("order").get();
    if (snap.empty) {
      list.innerHTML = `<div class="empty-state">主辦單位尚未上傳計畫書清單。</div>`;
      return;
    }
    list.innerHTML = "";
    snap.forEach((doc) => {
      const p = doc.data();
      const a = document.createElement("a");
      a.className = "list-btn";
      a.href = p.url || "#";
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = `<span>${p.name || "（未命名計畫）"}</span><span class="arrow">→</span>`;
      list.appendChild(a);
    });
  } catch (e) {
    list.innerHTML = `<p class="muted">讀取失敗，請確認網路連線後重新整理。</p>`;
    console.error(e);
  }
}
load();
</script>
</body>
</html>
